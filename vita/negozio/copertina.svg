<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Poppins, 'DejaVu Sans', Arial, sans-serif">
  <title>Kit cartelli per piccoli negozi - copertina</title>
  <rect width="1280" height="720" fill="#14213d"/>
  <circle cx="990" cy="390" r="320" fill="#1d2f57"/>
  <!-- testo -->
  <text x="70" y="108" font-size="24" font-weight="700" fill="#fca311" letter-spacing="3">STAMPA E COMPILA · IN ITALIANO</text>
  <text x="70" y="230" font-size="78" font-weight="700" fill="#ffffff">Kit cartelli</text>
  <text x="70" y="312" font-size="78" font-weight="700" fill="#ffffff">per piccoli</text>
  <text x="70" y="394" font-size="78" font-weight="700" fill="#ffffff">negozi</text>
  <rect x="70" y="440" width="500" height="64" rx="32" fill="#fca311"/>
  <text x="320" y="482" font-size="27" font-weight="700" fill="#14213d" text-anchor="middle">24 cartelli · PDF compilabili</text>
  <text x="70" y="556" font-size="24" fill="#cbd5e1">Scrivi, stampa, appendi.</text>
  <!-- mascotte -->
  <g transform="translate(64,578) scale(0.62)">
    <path d="M100 28 C132 28 154 52 154 82 C154 102 144 114 136 124 C131 130 130 134 130 142 L70 142 C70 134 69 130 64 124 C56 114 46 102 46 82 C46 52 68 28 100 28 Z" fill="#fca311"/>
    <rect x="72" y="148" width="56" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="80" y="162" width="40" height="8" rx="4" fill="#e5e5e5"/>
    <circle cx="84" cy="80" r="8" fill="#14213d"/><circle cx="116" cy="80" r="8" fill="#14213d"/>
    <circle cx="86" cy="78" r="2.5" fill="#fff"/><circle cx="118" cy="78" r="2.5" fill="#fff"/>
    <path d="M86 104 Q100 114 114 104" stroke="#14213d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="100" y1="28" x2="100" y2="14" stroke="#e5e5e5" stroke-width="6"/><circle cx="100" cy="12" r="6" fill="#e5e5e5"/>
  </g>
  <text x="190" y="650" font-size="22" fill="#cbd5e1">Fatto da Tino, un'intelligenza artificiale</text>

  <!-- foglio dietro a sinistra: LISTINO (testo a sinistra, la parte visibile) -->
  <g transform="translate(790,385) rotate(-9)">
    <rect x="-130" y="-184" width="260" height="368" rx="14" fill="#ffffff"/>
    <rect x="-118" y="-172" width="236" height="344" rx="9" fill="none" stroke="#14213d" stroke-width="4"/>
    <circle cx="-62" cy="-118" r="32" fill="#fca311"/>
    <path d="M-77 -112 L-67 -134 L-47 -134 L-47 -112 L-61 -96 Z" fill="none" stroke="#14213d" stroke-width="5" stroke-linejoin="round"/>
    <text x="-98" y="-48" font-size="28" font-weight="700" fill="#14213d">LISTINO</text>
    <text x="-98" y="-16" font-size="28" font-weight="700" fill="#14213d">PREZZI</text>
    <g stroke="#14213d" stroke-width="2" stroke-dasharray="2 5"><line x1="-98" y1="38" x2="20" y2="38"/><line x1="-98" y1="78" x2="20" y2="78"/><line x1="-98" y1="118" x2="20" y2="118"/></g>
    <g font-size="17" font-weight="700" fill="#14213d"><text x="-96" y="34">Caffè</text><text x="-96" y="74">Cornetto</text><text x="-96" y="114">Toast</text></g>
  </g>
  <!-- foglio dietro a destra: WI-FI (testo a destra) -->
  <g transform="translate(1110,380) rotate(8)">
    <rect x="-130" y="-184" width="260" height="368" rx="14" fill="#ffffff"/>
    <rect x="-118" y="-172" width="236" height="344" rx="9" fill="none" stroke="#14213d" stroke-width="4"/>
    <circle cx="62" cy="-118" r="32" fill="#fca311"/>
    <g fill="none" stroke="#14213d" stroke-width="5" stroke-linecap="round"><path d="M38 -122 A34 34 0 0 1 86 -122"/><path d="M47 -111 A20 20 0 0 1 77 -111"/></g>
    <circle cx="62" cy="-99" r="4" fill="#14213d"/>
    <text x="98" y="-30" font-size="42" font-weight="700" fill="#14213d" text-anchor="end">WI-FI</text>
    <text x="98" y="10" font-size="16" fill="#4a5568" text-anchor="end">Nome della rete</text>
    <text x="98" y="48" font-size="19" font-weight="700" fill="#14213d" text-anchor="end">BarAurora</text>
    <line x1="30" y1="58" x2="98" y2="58" stroke="#14213d" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="98" y="100" font-size="16" fill="#4a5568" text-anchor="end">Password</text>
    <text x="98" y="138" font-size="19" font-weight="700" fill="#14213d" text-anchor="end">caffe2026</text>
    <line x1="30" y1="148" x2="98" y2="148" stroke="#14213d" stroke-width="2" stroke-dasharray="2 5"/>
  </g>
  <!-- foglio davanti: TORNO SUBITO -->
  <g transform="translate(950,400) rotate(-1.5)">
    <rect x="-150" y="-212" width="300" height="424" rx="16" fill="#ffffff"/>
    <rect x="-137" y="-199" width="274" height="398" rx="10" fill="none" stroke="#14213d" stroke-width="5"/>
    <circle cx="0" cy="-130" r="44" fill="#fca311"/>
    <circle cx="0" cy="-130" r="23" fill="none" stroke="#14213d" stroke-width="5"/>
    <path d="M0 -130 L0 -146 M0 -130 L11 -124" stroke="#14213d" stroke-width="5" stroke-linecap="round" fill="none"/>
    <text x="0" y="-40" font-size="50" font-weight="700" fill="#14213d" text-anchor="middle">TORNO</text>
    <text x="0" y="16" font-size="50" font-weight="700" fill="#14213d" text-anchor="middle">SUBITO</text>
    <text x="0" y="88" font-size="17" fill="#4a5568" text-anchor="middle">Sono di ritorno alle ore</text>
    <text x="0" y="146" font-size="50" font-weight="700" fill="#14213d" text-anchor="middle">15:30</text>
    <line x1="-100" y1="158" x2="100" y2="158" stroke="#14213d" stroke-width="2.5" stroke-dasharray="2 5"/>
  </g>
